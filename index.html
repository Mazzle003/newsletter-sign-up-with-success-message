<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#242742] font-(family-name:Roboto, sans-serif)">
        <div
            class="flex flex-col items-center justify-center m-[60px] mt-[40px] min-h-[100%] bg-[#ffffff] m-auto w-fit lg:w-[700px] gap-[50px] rounded-[25px] text-[16px] p-[0] lg:flex-row lg:p-[30px]">
        
            <div class="p-[25px] lg:p-[0]">
                <h2 class="text-[30px] text-[#242742] font-[700] mb-[20px] md:text-[35px]">Stay updated!</h2>
                <p class="text-[14px] mb-[30px]">Join 60,000+ product managers receiving monthly updates on:</p>

                <div class="flex flex-col gap-[10px] mb-[20px] mb-[30px]">
                    <div class="flex items-center gap-[10px]">
                        <img class="w-[20px]" src="/assets/images/icon-success.svg" alt="check-icon">
                        <span class="text-sm">Product discovery and building what matters</span>
                    </div>
                    <div class="flex items-center gap-[10px]">
                        <img class="w-[20px]" src="/assets/images/icon-success.svg" alt="check-icon">
                        <span class="text-sm">Measuring to ensure updates are a success</span>
                    </div>
                    <div class="flex items-center gap-[10px]">
                        <img class="w-[20px]" src="/assets/images/icon-success.svg" alt="check-icon">
                        <span class="text-sm">And much more!</span>
                    </div>
                </div>

                <form class="flex flex-col gap-[10px] text-[#242742]" action="/success.html">
                    <label class="font-[700] text-sm" for="email">Email address</label>
                    <input class="block border-[1px] p-[10px] pl-[20px] outline-none rounded-[5px] italic mb-[10px]" type="email" id="email"
                        placeholder="email@example.com" required/>
                    <button
                        class="outline-none border-[0] rounded-[5px] bg-[#242742] text-[#fff] p-[10px] font-[600] hover:bg-[#ff6257] shadow-[5px 15px #ff6257]"
                        type="submit">Subscribe tomonthly newsletter</button>
                </form>
            </div>


            
                <img class="w-[50%] hidden lg:block" src="/assets/images/illustration-sign-up-desktop.svg"
                    alt="sign-up">
                
                <img class="w-[100%] order-first lg:hidden" src="/assets/images/illustration-sign-up-mobile.svg" alt="sign-up">
            
        </div>


        <script src="/main.js"></script>
</body>

</html>
