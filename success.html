<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Success Page</title>
</head>
<body class="bg-[#fff] md:bg-[#242742]">
    <div class="flex items-center justify-center pt-[50px] pb-[50px] pr-[20px] pl-[20px] md:pr-[100px] md:pl-[100px]">
        
        <div class="lg:w-[40%] md:w-[75%] grid items-center gap-[150px] md:gap-[0px] bg-[#fff] md:bg-[none] text-[#242742] text-[16px] md:p-[50px] rounded-3xl sm:p-[0px] lg:m-[50px] sm:mt-[150px] sm:mb-[150px] mt-[100px]">

            <div>
                <div class="mb-[20px]">
                    <img class="w-[40px]" src="/assets/images/icon-success.svg"
                        alt="check-icon">
                </div>
                <h2 class="text-[40px] font-[700] mb-[20px] leading-[1]">Thanks for Subscribing!</h2>
                <p class="lg:mb-[0px]">A confirmation email has been sent to <span class="font-[600]">example@gmail.com</span>. Please
                    open
                    it and click the button inside to confirm your subscription. </p>
            </div>
    

            <div>
                <a href="/index.html">
                    <button
                        class="w-[100%] bg-[#242742] text-[#fff] font-[600] text-[center] p-[15px] mt-[30px] rounded-[10px] hover:bg-linear-to-r from-[#ff6257] to-red-800">Dismiss
                        Message
                    </button>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
